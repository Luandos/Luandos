<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="232" viewBox="0 0 440 232" role="img" aria-label="~/resumo">
<title>~/resumo</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0221"/><stop offset="1" stop-color="#1A0A3D"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A855F7" stop-opacity=".95"/><stop offset=".55" stop-color="#3B1A6B"/><stop offset="1" stop-color="#FF2E97" stop-opacity=".75"/></linearGradient>
  <linearGradient id="gp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset=".6" stop-color="#A855F7"/><stop offset="1" stop-color="#FF2E97"/></linearGradient>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A855F7" stop-opacity="0"/><stop offset=".5" stop-color="#A855F7" stop-opacity=".09"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#A855F7" stroke-opacity=".07"/></pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="440" height="232" rx="14"/></clipPath>
  
</defs>
<style>
  text{font-family:'Fira Code','JetBrains Mono','SF Mono',ui-monospace,Consolas,'DejaVu Sans Mono',monospace}
  .in{animation:in .7s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .draw{stroke-dasharray:1000;animation:draw 2.2s ease-out both}
  @keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .scan{animation:scan 7s linear infinite}
  @keyframes scan{from{transform:translateY(-50px)}to{transform:translateY(232px)}}
  @media (prefers-reduced-motion:reduce){.in,.grow,.draw,.seg,.ring,.scan{animation:none!important}}
  
</style>
<g clip-path="url(#clip)">
  <rect width="440" height="232" fill="url(#bg)"/>
  <rect width="440" height="232" fill="url(#grid)"/>
  <rect class="scan" width="440" height="50" fill="url(#scanG)"/>
  <circle cx="20" cy="17" r="4.5" fill="#FF2E97"/><circle cx="36" cy="17" r="4.5" fill="#A855F7"/><circle cx="52" cy="17" r="4.5" fill="#3B1A6B"/>
  <text x="70" y="21" font-size="11" fill="#9C84C9" text-anchor="start" font-weight="400" >luandos@github:~/resumo</text>
  <rect class="blink" x="226.3" y="10" width="7" height="13" fill="#A855F7"/>
  <circle class="pulse" cx="374" cy="17" r="3.5" fill="#FF2E97"/>
  <text x="420" y="21" font-size="10" fill="#9C84C9" text-anchor="end" font-weight="400" >online</text>
  <line x1="0" y1="34" x2="440" y2="34" stroke="#3B1A6B" stroke-opacity=".8"/>
  <g class="in" style="animation-delay:0.15s"><rect x="18" y="54" width="128" height="68" rx="9" fill="#1A0B38" stroke="#3B1A6B"/><rect x="18" y="66" width="3" height="44" rx="1.5" fill="#FF2E97"/><text x="32" y="77" font-size="9.5" fill="#9C84C9" text-anchor="start" font-weight="400" letter-spacing="1">COMMITS</text><text x="32" y="106" font-size="24" fill="url(#gp)" text-anchor="start" font-weight="700" >74</text></g>
<g class="in" style="animation-delay:0.24s"><rect x="156" y="54" width="128" height="68" rx="9" fill="#1A0B38" stroke="#3B1A6B"/><rect x="156" y="66" width="3" height="44" rx="1.5" fill="#A855F7"/><text x="170" y="77" font-size="9.5" fill="#9C84C9" text-anchor="start" font-weight="400" letter-spacing="1">PULL REQUESTS</text><text x="170" y="106" font-size="24" fill="#D8C7F5" text-anchor="start" font-weight="700" >3</text></g>
<g class="in" style="animation-delay:0.33s"><rect x="294" y="54" width="128" height="68" rx="9" fill="#1A0B38" stroke="#3B1A6B"/><rect x="294" y="66" width="3" height="44" rx="1.5" fill="#A855F7"/><text x="308" y="77" font-size="9.5" fill="#9C84C9" text-anchor="start" font-weight="400" letter-spacing="1">ISSUES</text><text x="308" y="106" font-size="24" fill="#D8C7F5" text-anchor="start" font-weight="700" >4</text></g>
<g class="in" style="animation-delay:0.42s"><rect x="18" y="132" width="128" height="68" rx="9" fill="#1A0B38" stroke="#3B1A6B"/><rect x="18" y="144" width="3" height="44" rx="1.5" fill="#A855F7"/><text x="32" y="155" font-size="9.5" fill="#9C84C9" text-anchor="start" font-weight="400" letter-spacing="1">REPOSITÓRIOS</text><text x="32" y="184" font-size="24" fill="#D8C7F5" text-anchor="start" font-weight="700" >5</text></g>
<g class="in" style="animation-delay:0.51s"><rect x="156" y="132" width="128" height="68" rx="9" fill="#1A0B38" stroke="#3B1A6B"/><rect x="156" y="144" width="3" height="44" rx="1.5" fill="#A855F7"/><text x="170" y="155" font-size="9.5" fill="#9C84C9" text-anchor="start" font-weight="400" letter-spacing="1">ESTRELAS</text><text x="170" y="184" font-size="24" fill="#D8C7F5" text-anchor="start" font-weight="700" >0</text></g>
<g class="in" style="animation-delay:0.60s"><rect x="294" y="132" width="128" height="68" rx="9" fill="#1A0B38" stroke="#3B1A6B"/><rect x="294" y="144" width="3" height="44" rx="1.5" fill="#A855F7"/><text x="308" y="155" font-size="9.5" fill="#9C84C9" text-anchor="start" font-weight="400" letter-spacing="1">SEGUIDORES</text><text x="308" y="184" font-size="24" fill="#D8C7F5" text-anchor="start" font-weight="700" >1</text></g>
<g class="in" style="animation-delay:.9s"><text x="220.0" y="220" font-size="10" fill="#9C84C9" text-anchor="middle" font-weight="400" >membro desde jun/2025</text></g>
</g>
<rect x=".75" y=".75" width="438.5" height="230.5" rx="13.5" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
<path d="M12 206 V220 H26 M428 206 V220 H414" fill="none" stroke="#FF2E97" stroke-opacity=".85" stroke-width="1.5"/>
</svg>
