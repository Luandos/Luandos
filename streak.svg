<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="196" viewBox="0 0 900 196" role="img" aria-label="~/sequencia">
<title>~/sequencia</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0221"/><stop offset="1" stop-color="#1A0A3D"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A855F7" stop-opacity=".95"/><stop offset=".55" stop-color="#3B1A6B"/><stop offset="1" stop-color="#FF2E97" stop-opacity=".75"/></linearGradient>
  <linearGradient id="gp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset=".6" stop-color="#A855F7"/><stop offset="1" stop-color="#FF2E97"/></linearGradient>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A855F7" stop-opacity="0"/><stop offset=".5" stop-color="#A855F7" stop-opacity=".09"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#A855F7" stroke-opacity=".07"/></pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="900" height="196" rx="14"/></clipPath>
  
</defs>
<style>
  text{font-family:'Fira Code','JetBrains Mono','SF Mono',ui-monospace,Consolas,'DejaVu Sans Mono',monospace}
  .in{animation:in .7s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .draw{stroke-dasharray:1000;animation:draw 2.2s ease-out both}
  @keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .scan{animation:scan 7s linear infinite}
  @keyframes scan{from{transform:translateY(-50px)}to{transform:translateY(196px)}}
  @media (prefers-reduced-motion:reduce){.in,.grow,.draw,.seg,.ring,.scan{animation:none!important}}
  @keyframes rg{from{stroke-dashoffset:289.03}to{stroke-dashoffset:289.03}}.ring{animation:rg 1.6s .3s cubic-bezier(.2,.8,.2,1) both}
</style>
<g clip-path="url(#clip)">
  <rect width="900" height="196" fill="url(#bg)"/>
  <rect width="900" height="196" fill="url(#grid)"/>
  <rect class="scan" width="900" height="50" fill="url(#scanG)"/>
  <circle cx="20" cy="17" r="4.5" fill="#FF2E97"/><circle cx="36" cy="17" r="4.5" fill="#A855F7"/><circle cx="52" cy="17" r="4.5" fill="#3B1A6B"/>
  <text x="70" y="21" font-size="11" fill="#9C84C9" text-anchor="start" font-weight="400" >luandos@github:~/sequencia</text>
  <rect class="blink" x="246.1" y="10" width="7" height="13" fill="#A855F7"/>
  <circle class="pulse" cx="834" cy="17" r="3.5" fill="#FF2E97"/>
  <text x="880" y="21" font-size="10" fill="#9C84C9" text-anchor="end" font-weight="400" >online</text>
  <line x1="0" y1="34" x2="900" y2="34" stroke="#3B1A6B" stroke-opacity=".8"/>
  <line x1="300" y1="60" x2="300" y2="168" stroke="#3B1A6B" stroke-dasharray="2 5"/><line x1="600" y1="60" x2="600" y2="168" stroke="#3B1A6B" stroke-dasharray="2 5"/><g class="in" style="animation-delay:.15s"><text x="150" y="114" font-size="40" fill="#D8C7F5" text-anchor="middle" font-weight="700" >87</text><text x="150" y="138" font-size="10.5" fill="#9C84C9" text-anchor="middle" font-weight="400" >desde jun/2025</text><text x="150" y="176" font-size="10" fill="#A855F7" text-anchor="middle" font-weight="400" letter-spacing="1.2">TOTAL DE CONTRIBUIÇÕES</text></g><g class="in" style="animation-delay:.3s"><circle cx="450" cy="106" r="46" fill="none" stroke="#26124D" stroke-width="7"/><circle class="ring" cx="450" cy="106" r="46" fill="none" stroke="url(#gp)" stroke-width="7" stroke-linecap="round" stroke-dasharray="289.03" stroke-dashoffset="289.03" transform="rotate(-90 450 106)" filter="url(#glow)"/><text x="450" y="114" font-size="32" fill="#D8C7F5" text-anchor="middle" font-weight="700" >0</text><text x="450" y="130" font-size="9.5" fill="#9C84C9" text-anchor="middle" font-weight="400" >dias</text><text x="450" y="176" font-size="10" fill="#FF2E97" text-anchor="middle" font-weight="400" letter-spacing="1.2">SEQUÊNCIA ATUAL</text></g><g class="in" style="animation-delay:.45s"><text x="750" y="114" font-size="40" fill="#D8C7F5" text-anchor="middle" font-weight="700">3<tspan font-size="13" fill="#9C84C9" font-weight="400"> dias</tspan></text><text x="750" y="138" font-size="10.5" fill="#9C84C9" text-anchor="middle" font-weight="400" >2 set - 4 set</text><text x="750" y="176" font-size="10" fill="#A855F7" text-anchor="middle" font-weight="400" letter-spacing="1.2">MAIOR SEQUÊNCIA</text></g>
</g>
<rect x=".75" y=".75" width="898.5" height="194.5" rx="13.5" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
<path d="M12 170 V184 H26 M888 170 V184 H874" fill="none" stroke="#FF2E97" stroke-opacity=".85" stroke-width="1.5"/>
</svg>
